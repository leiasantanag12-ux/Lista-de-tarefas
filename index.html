<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de tarefas</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="./arq.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Organizador de tarefas</h1>
        
        
        <form id="form-tarefa">
            <input type="text" id="input-tarefa" placeholder="Adicione a Tarefa" required>
            <button type="submit">Adicionar</button> 
        </form>

        <div class="consulta">
            <input type="text" id="input-busca" placeholder="Consultar tarefa...">
            <select id="filtro-prioridade">
                <option value="todas">Todas prioridades</option>
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
            </select>
        </div>

        <ul id="tarefas"></ul>
    </div>
</body>
</html>
